<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        justify-content: center;
        align-items: center;
        gap: 30px;
        
      }
      .small-box {
        width: 200px;
        height: 200px;
        background-color: teal;
      }
      .big-box {
        width: 400px;
        height: 400px;
        background-color: rgb(163, 19, 120);
        border-radius: 50%;
      }
      #box {
  transition: border-radius 0.4s ease, width 0.4s ease, height 0.4s ease, background-color 0.8s ease 0.3s;
}
    </style>
  </head>
  <body>
    <div class="small-box" id="box"></div>
    <button id="btn"></button>
    <script>
      const body = document.querySelector("body");
      const box = document.querySelector("#box");
      const btn = document.querySelector("#btn");
      btn.textContent = "kaboomButtonHandler";
      btn.addEventListener("click", function () {
          if (box.classList.contains("big-box")) {
                box.classList.remove("big-box");
                box.classList.add("small-box");
            } 
            else {
                box.classList.remove("small-box");
                box.classList.add("big-box");
            }
        });
    //     box.classList.remove("small-box");
    //     box.classList.add("big-box");
    //   });
    </script>
  </body>
</html>
